name: Build WeKnora Lite (Windows Only)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Build tag/name (e.g., v0.8.4-win)'
        required: true
        default: 'v0.8.4-win-build'

concurrency:
  group: build-lite-win-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"

jobs:
  # ── 1. 构建前端 ──
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # 移除 cache 和 cache-dependency-path 避免找不到 lockfile 报错
      - name: Build frontend
        working-directory: frontend
        run: |
          # 将 npm ci 改为 npm install 兼容无 lockfile 的情况
          npm install
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ── 2. 构建 Windows CLI (Web Server) ──
  build-windows-cli:
    name: Build Windows CLI
    needs: build-frontend
    runs-on: windows-latest
    env:
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: web/

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-pkg-config

      - name: Configure Environment
        shell: pwsh
        run: |
          echo "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "PKG_CONFIG_PATH=C:\msys64\ucrt64\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build WeKnora Lite CLI
        shell: bash
        run: |
          export EDITION=lite
          eval "$(./scripts/get_version.sh env 2>/dev/null || true)"
          LDFLAGS="-w -s $(./scripts/get_version.sh ldflags 2>/dev/null || true)"
          export CGO_CFLAGS="-Wno-deprecated-declarations"
          go build -tags "sqlite_fts5" -ldflags="${LDFLAGS}" -o WeKnora-lite.exe ./cmd/server
          
      - name: Package CLI
        shell: bash
        run: |
          ARCHIVE="WeKnora-lite_${{ inputs.tag }}_windows_amd64"
          mkdir -p "${ARCHIVE}/web"
          cp WeKnora-lite.exe "${ARCHIVE}/"
          cp -r web/* "${ARCHIVE}/web/"
          cp .env.lite.example "${ARCHIVE}/"
          [ -f docs/LITE.md ] && cp docs/LITE.md "${ARCHIVE}/README.md"
          [ -d config ] && cp -r config "${ARCHIVE}/config"
          [ -d migrations/sqlite ] && { mkdir -p "${ARCHIVE}/migrations/sqlite"; cp -r migrations/sqlite/* "${ARCHIVE}/migrations/sqlite/"; }
          tar -czf "${ARCHIVE}.tar.gz" "${ARCHIVE}"
          sha256sum "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: WeKnora-CLI-Windows
          path: |
            WeKnora-lite_*.tar.gz
            WeKnora-lite_*.tar.gz.sha256
          retention-days: 7

  # ── 3. 构建 Windows 桌面 APP (Wails + NSIS) ──
  build-windows-desktop:
    name: Build Windows Desktop App
    needs: build-frontend
    runs-on: windows-latest
    env:
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # 同样移除缓存配置以避免报错

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Install NSIS
        run: choco install nsis -y

      - name: Setup MSYS2 UCRT64 for Desktop
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-pkg-config

      - name: Configure Environment
        shell: pwsh
        run: |
          echo "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "PKG_CONFIG_PATH=C:\msys64\ucrt64\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Pre-compile Go packages
        shell: bash
        run: |
          export GOLANG_PROTOBUF_REGISTRATION_CONFLICT=warn
          export CGO_CFLAGS="-Wno-deprecated-declarations"
          cd cmd/desktop
          go build -p 1 -buildvcs=false -tags "desktop,sqlite_fts5,production" -o _prebuild_tmp.exe . || true
          rm -f _prebuild_tmp.exe

      - name: Build desktop app
        shell: bash
        run: |
          export EDITION=lite
          export GOLANG_PROTOBUF_REGISTRATION_CONFLICT=warn
          eval "$(./scripts/get_version.sh env 2>/dev/null || true)"
          LDFLAGS="$(./scripts/get_version.sh ldflags 2>/dev/null || true) -X 'google.golang.org/protobuf/reflect/protoregistry.conflictPolicy=warn'"
          export CGO_CFLAGS="-Wno-deprecated-declarations"

          [ -f ./scripts/check-license-bundle.sh ] && bash ./scripts/check-license-bundle.sh
          cd cmd/desktop
          wails build -clean \
            -tags "sqlite_fts5" \
            -platform "windows/amd64" \
            -nsis \
            -ldflags="${LDFLAGS}" \
            -o "WeKnora Lite"

      - name: Package Windows app
        shell: bash
        run: |
          ARCHIVE="WeKnora-Lite-App_${{ inputs.tag }}_windows_amd64"
          INSTALLER="cmd/desktop/build/bin/WeKnora Lite-amd64-installer.exe"
          test -f "$INSTALLER"
          cp "$INSTALLER" "${ARCHIVE}_setup.exe"
          sha256sum "${ARCHIVE}_setup.exe" > "${ARCHIVE}_setup.exe.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: WeKnora-Desktop-Windows
          path: |
            WeKnora-Lite-App_*.exe
            WeKnora-Lite-App_*.sha256
          retention-days: 7
